<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 - Ticket Booking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }

        header {
            background-color: #07152f;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h2 {
            color: #ffb900;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffb900;
        }

        main {
            max-width: 750px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #07152f;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .preferences {
            margin-top: 22px;
        }

        .preferences label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            font-weight: normal;
        }

        .preferences input {
            width: auto;
        }

        button {
            padding: 13px 25px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #07152f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffb900;
            color: #07152f;
        }

        #successMessage {
            display: none;
            color: green;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        footer {
            background-color: #07152f;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header {
                gap: 15px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            main {
                margin: 15px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>IPL 2026</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#matches">Matches</a>
        <a href="booking.html">Book Tickets</a>
        <a href="index.html#guidelines">Guidelines</a>
    </nav>
</header>

<main>

    <h1>IPL 2026 Ticket Booking</h1>

    <form id="bookingForm">

        <label for="name">Full Name:</label>
        <input type="text" id="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone"
               placeholder="Enter 10-digit phone number"
               pattern="[0-9]{10}" required>

        <label for="match">Select Match:</label>
        <select id="match" required>
            <option value="">-- Select Match --</option>
            <option>RCB vs CSK</option>
            <option>MI vs KKR</option>
            <option>CSK vs MI</option>
            <option>CSK vs SRH</option>
        </select>

        <label for="stand">Select Stand Category:</label>
        <select id="stand" required>
            <option value="">-- Select Stand --</option>
            <option>General Stand</option>
            <option>Premium Stand</option>
            <option>VIP Stand</option>
        </select>

        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets"
               min="1" max="10" required
               placeholder="Enter number of tickets">

        <div class="preferences">
            <strong>Additional Preferences:</strong>

            <label>
                <input type="radio" name="food"
                       value="Food Included">
                Food Included
            </label>

            <label>
                <input type="radio" name="food"
                       value="No Food">
                No Food
            </label>
        </div>

        <button type="submit">Book Tickets</button>
        <button type="reset">Reset</button>

        <p id="successMessage">
            Your tickets have been booked successfully!
        </p>

    </form>

    

</main>

<footer>
    &copy; 2026 IPL Ticket Booking. All Rights Reserved.
</footer>

<script>
    const form = document.getElementById("bookingForm");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        document.getElementById("successMessage").style.display = "block";
    });

    form.addEventListener("reset", function() {
        document.getElementById("successMessage").style.display = "none";
    });
</script>

<script src="app.js"></script>

</body>
</html>
